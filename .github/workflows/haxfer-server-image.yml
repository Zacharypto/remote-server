name: Build Haxfer hbbs image

# 放到 Haxfer 服务端 fork 的 .github/workflows/ 目录下。
#
# 作用：把带 TCP 注册/路由补丁的 hbbs + hbbr 编译出来，打成 **classic 镜像**
#      （FROM scratch + 两个二进制），推到 GHCR。
#      生产 compose 只要把 image 指向它，docker compose up -d 即可。
#
# 为什么自己打镜像：
#   生产是 docker compose 部署的（server/docker-compose.yml），跑的是
#   rustdesk/rustdesk-server:latest —— 那是上游的 classic 镜像，
#   handle_tcp 对 RegisterPk 返回 NOT_SUPPORT。补丁要生效就必须换镜像。
#
# 为什么用 GHCR 而不是 Docker Hub：
#   GHCR 用内置 GITHUB_TOKEN 就能推（packages: write），不需要额外配
#   DOCKER_HUB_USERNAME / PASSWORD 之类的 secrets。
#   仓库自带的 build.yaml 推 Docker Hub 且只构建 s6 变体，与本部署不匹配。
#
# 产物：ghcr.io/<owner>/haxfer-hbbs:<tag>
#   tag 手动触发时用输入的 tag，push tag 时用 tag 名。
#
# 用法（服务器上）：
#   docker compose pull && docker compose up -d
#   回滚：把 compose 的 image 改回 rustdesk/rustdesk-server:latest 再 up -d。
#   data/ 目录（含密钥与设备库）不受影响 —— classic 镜像的 WORKDIR/HOME
#   仍是 /root，与上游一致。

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "镜像 tag（例如 1.1.16-tcp1）"
        required: true
        default: "1.1.16-tcp1"
  push:
    tags:
      - "haxfer-*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: haxfer-hbbs

jobs:
  image:
    runs-on: ubuntu-22.04
    # ⚠️ 刻意**不**覆盖 musl 的 linker / CC（踩过坑，见 tcp3）。
    #    rustc 对 x86_64-unknown-linux-musl 默认就静态链接，直接 cargo build 就对；
    #    一旦把 linker 换成 musl-gcc，反而会链成「依赖 /lib/ld-musl-x86_64.so.1 的
    #    动态二进制」。更阴的是：glibc 的 ldd 认不出 musl 解释器，会误报
    #    "not a dynamic executable" —— 断言看着全绿，镜像却进不了 scratch。
    #    ⇒ 静态与否必须用 readelf 查 INTERP 段，不能用 ldd。
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-hbbs-image-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-hbbs-image-

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev clang musl-tools

      # ⚠️ 必须用 musl target 做**静态链接**。
      #    docker-classic/Dockerfile 是 `FROM scratch` —— 里面没有 glibc、
      #    没有动态加载器。glibc 动态链接的二进制放进去一启动就报
      #    "no such file or directory"（找不到 ld-linux），容器直接挂。
      #    官方 build.yaml 的 Linux 构建同样用 x86_64-unknown-linux-musl，
      #    这里对齐它，并保留 --all-features 以匹配官方产物能力。
      # ⚠️ 不加 --cfg has_std：那是本机 Windows 管道沙箱的绕过手段，
      #    Linux runner 上 autocfg 能正常探测。
      - name: 编译 hbbs / hbbr（release，musl 静态链接）
        run: |
          cargo build --release --locked --all-features \
            --target x86_64-unknown-linux-musl \
            --bin hbbs --bin hbbr

      - name: 组装 classic 镜像构建上下文
        run: |
          mkdir -p .image-context
          cp target/x86_64-unknown-linux-musl/release/hbbs .image-context/hbbs
          cp target/x86_64-unknown-linux-musl/release/hbbr .image-context/hbbr
          cp docker-classic/Dockerfile .image-context/Dockerfile
          ls -la .image-context

      # 防止「动态链接的二进制塞进 scratch 镜像」这个坑再次发生。
      # ⚠️ 判据是 readelf 的 INTERP 段**必须不存在**，不是 ldd ——
      #    glibc 的 ldd 对 musl 动态二进制会误报 "not a dynamic executable"。
      - name: 断言二进制为静态链接（readelf INTERP）
        run: |
          for bin in hbbs hbbr; do
            if readelf -l ".image-context/$bin" 2>/dev/null | grep -q INTERP; then
              echo "FAIL $bin 含 INTERP 段 —— 它是动态二进制，FROM scratch 里跑不起来："
              readelf -l ".image-context/$bin" | grep -A1 INTERP || true
              exit 1
            fi
            echo "OK  $bin 无 INTERP 段（静态链接）"
          done

      # GHCR 的镜像名必须全小写，而 GitHub 用户名可能含大写
      - name: 归一化 owner 为小写
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: 决定 tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image-tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # 触发用的 tag 带 haxfer- 前缀，是为了跟上游 rustdesk-server 的
            # 版本 tag 区分开（别混进同一个 tag 命名空间）。
            # 镜像名本身已经叫 haxfer-hbbs，这里把前缀去掉，免得重复。
            TAG="${TAG#haxfer-}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "将推送镜像 tag：$TAG"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 先在本地构建一份**不推送**，验证通过才推 —— 否则坏镜像会直接覆盖
      # GHCR 上的 :latest，服务器 pull 到就起不来（tcp1 就是这么坏掉的）。
      - name: 本地构建镜像（不推送，待验证）
        uses: docker/build-push-action@v5
        with:
          context: .image-context
          platforms: linux/amd64
          push: false
          load: true
          tags: haxfer-hbbs:verify

      # 日志里的 "Listening on tcp/udp" 在源码里早于 bind socket，不能拿它当 readiness。
      # 真启动两个容器，并做实际 TCP RegisterPk/RegisterPeer + UDP RegisterPk 探测。
      # 失败诊断写入 ::error::；只有此 smoke 通过，后面的 step 才能推镜像。
      - name: 冒烟测试：scratch 中 hbbs/hbbr 实际监听
        run: |
          set +e
          out=$(python3 - <<'PY'
          import json
          import socket
          import subprocess
          import sys
          import time
          import traceback

          def run(args):
              result = subprocess.run(args, text=True, capture_output=True)
              if result.returncode:
                  raise RuntimeError(f"command failed ({result.returncode}): {args}\n{result.stdout}\n{result.stderr}")
              return result.stdout.strip()

          def published_port(container, spec):
              lines = run(["docker", "port", container, spec]).splitlines()
              if not lines:
                  raise RuntimeError(f"没有宿主端口映射：{container} {spec}")
              return int(lines[0].rsplit(":", 1)[1])

          def wait_running(container, timeout=12):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  data = json.loads(run(["docker", "inspect", container]))[0]
                  if data["State"]["Running"]:
                      return
                  if data["State"].get("Status") == "exited":
                      raise RuntimeError(f"{container} 已退出：{data['State'].get('ExitCode')} {data['State'].get('Error')}")
                  time.sleep(0.2)
              raise RuntimeError(f"{container} 未在 {timeout}s 内进入运行状态")

          def probe_tcp(port, label):
              with socket.create_connection(("127.0.0.1", port), timeout=2):
                  pass
              print(f"OK TCP {label} 127.0.0.1:{port}")

          def varint(value):
              out = bytearray()
              while value > 0x7f:
                  out.append((value & 0x7f) | 0x80)
                  value >>= 7
              out.append(value)
              return bytes(out)

          def field_bytes(number, value):
              return varint((number << 3) | 2) + varint(len(value)) + value

          def decode_varint(buf, offset=0):
              value = shift = 0
              while True:
                  byte = buf[offset]
                  offset += 1
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return value, offset
                  shift += 7
                  if shift > 63:
                      raise RuntimeError("protobuf varint 过长")

          def read_varint(sock):
              value = shift = 0
              while True:
                  b = sock.recv(1)
                  if not b:
                      raise RuntimeError("TCP 对端在 protobuf 响应未读完整时关闭连接")
                  byte = b[0]
                  value |= (byte & 0x7f) << shift
                  if not byte & 0x80:
                      return value
                  shift += 7
                  if shift > 63:
                      raise RuntimeError("protobuf varint 过长")

          def read_response(sock):
              tag = read_varint(sock)
              wire = tag & 7
              if wire != 2:
                  raise RuntimeError(f"响应不是 length-delimited protobuf oneof，tag={tag}")
              size = read_varint(sock)
              payload = bytearray()
              while len(payload) < size:
                  chunk = sock.recv(size - len(payload))
                  if not chunk:
                      raise RuntimeError("TCP 对端关闭，protobuf payload 不完整")
                  payload.extend(chunk)
              return tag >> 3, bytes(payload)

          def register_pk_message(peer_id, uuid_bytes, public_key):
              body = (field_bytes(1, peer_id.encode())
                      + field_bytes(2, uuid_bytes)
                      + field_bytes(3, public_key))
              return field_bytes(15, body)  # RendezvousMessage.register_pk

          def register_peer_message(peer_id):
              return field_bytes(1, field_bytes(1, peer_id.encode()))

          def read_datagram_response(data):
              tag, offset = decode_varint(data)
              size, offset = decode_varint(data, offset)
              if offset + size != len(data):
                  raise RuntimeError(f"protobuf datagram 长度不匹配：{data.hex()}")
              return tag >> 3, data[offset:]

          def assert_pk_ok(field, payload, expected_id):
              if field != 16:
                  raise RuntimeError(f"期望 RegisterPkResponse，收到 oneof field {field}")
              # RegisterPkResponse.result 是 field 1 的枚举；OK=0 可省略，其它结果非零。
              result = 0
              i = 0
              while i < len(payload):
                  key, i = decode_varint(payload, i)
                  if key == 8:
                      result, i = decode_varint(payload, i)
                  elif key == 16:
                      _, i = decode_varint(payload, i)  # keep_alive
                  else:
                      raise RuntimeError(f"RegisterPkResponse protobuf 字段异常：{payload.hex()}")
              if result != 0:
                  raise RuntimeError(f"RegisterPk {expected_id} 被拒绝，result={result}")
              print(f"OK RegisterPk accepted: {expected_id}")

          def assert_register_peer_ok(sock, peer_id):
              field, payload = read_response(sock)
              if field != 17:
                  raise RuntimeError(f"期望 RegisterPeerResponse，收到 oneof field {field}")
              i = 0
              request_pk = False
              while i < len(payload):
                  key, i = decode_varint(payload, i)
                  if key == 16:  # RegisterPeerResponse.request_pk = field 2
                      value, i = decode_varint(payload, i)
                      request_pk = bool(value)
                  else:
                      raise RuntimeError(f"RegisterPeerResponse protobuf 字段异常：{payload.hex()}")
              if request_pk:
                  raise RuntimeError(f"RegisterPeer {peer_id} 被服务端要求重新注册公钥")
              print(f"OK RegisterPeer kept online: {peer_id}")

          containers = ["haxfer-hbbs-smoke", "haxfer-hbbr-smoke"]
          try:
              run(["docker", "run", "-d", "--name", containers[0],
                   "-p", "127.0.0.1::21116/tcp", "-p", "127.0.0.1::21116/udp",
                   "-p", "127.0.0.1::21115/tcp", "--entrypoint", "/usr/bin/hbbs",
                   "haxfer-hbbs:verify", "-p", "21116", "-k", "_"])
              run(["docker", "run", "-d", "--name", containers[1],
                   "-p", "127.0.0.1::21117/tcp", "--entrypoint", "/usr/bin/hbbr",
                   "haxfer-hbbs:verify", "-p", "21117", "-k", "_"])
              for container in containers:
                  wait_running(container)
              rendezvous_tcp = published_port(containers[0], "21116/tcp")
              nat_tcp = published_port(containers[0], "21115/tcp")
              relay_tcp = published_port(containers[1], "21117/tcp")
              udp_port = published_port(containers[0], "21116/udp")
              probe_tcp(rendezvous_tcp, "hbbs rendezvous")
              probe_tcp(nat_tcp, "hbbs NAT test")
              probe_tcp(relay_tcp, "hbbr relay")

              # 在同一条裸 TCP 长连接上验证 TCP RegisterPk + RegisterPeer。
              peer_id = "999991111"
              uuid_bytes = bytes([1]) * 16
              public_key = bytes([2]) * 32
              with socket.create_connection(("127.0.0.1", rendezvous_tcp), timeout=3) as sock:
                  sock.settimeout(3)
                  sock.sendall(register_pk_message(peer_id, uuid_bytes, public_key))
                  field, payload = read_response(sock)
                  assert_pk_ok(field, payload, peer_id)
                  sock.sendall(register_peer_message(peer_id))
                  assert_register_peer_ok(sock, peer_id)

              # 独立 peer ID 验证 UDP socket 不只是被 Docker 映射，实际 handler 也能收发。
              deadline = time.time() + 8
              last_error = None
              attempt = 0
              while time.time() < deadline:
                  attempt += 1
                  udp_id = f"99999{attempt:04d}"
                  udp_request = register_pk_message(udp_id, bytes([3]) * 16, bytes([4]) * 32)
                  try:
                      with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                          sock.settimeout(0.7)
                          sock.sendto(udp_request, ("127.0.0.1", udp_port))
                          datagram, _ = sock.recvfrom(2048)
                  except OSError as exc:
                      last_error = exc
                      time.sleep(0.2)
                      continue
                  field, payload = read_datagram_response(datagram)
                  assert_pk_ok(field, payload, udp_id)
                  print(f"OK UDP RegisterPk 127.0.0.1:{udp_port}")
                  break
              else:
                  raise RuntimeError(f"UDP RegisterPk 没有响应：{last_error}")

              print("OK：hbbs TCP 注册/保活、UDP 注册、NAT 端口与 hbbr 中继监听均已实际探测")
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          finally:
              for container in containers:
                  subprocess.run(["docker", "rm", "-f", container], capture_output=True)
          PY
          )
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            diag=$(printf '%s' "$out" | tr '\n' '|' | head -c 1000)
            echo "::error::scratch 镜像真实监听冒烟测试失败：$diag"
            exit 1
          fi

      - name: 构建并推送 classic 镜像
        uses: docker/build-push-action@v5
        with:
          context: .image-context
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest

      - name: 输出摘要
        run: |
          {
            echo "## 镜像已推送"
            echo ""
            echo '```'
            echo "ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
            echo '```'
            echo ""
            echo "服务器上改 compose 的 image 后执行："
            echo ""
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
